[package]
name = "yeet"
version = "0.1.1"
edition = "2024"
description = "Native multiplatform agent CLI/TUI with a provider-neutral runtime and remote UI"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/kyooni18/Yeet"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
calamine = "0.36.1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
csv = "1.4.0"
dirs = "6"
dotenvy = "0.15"
fs2 = "0.4"
libc = "0.2"
flate2 = "1"
openssl = { version = "0.10", features = ["vendored"] }
pdf-extract = "0.12.0"
quick-xml = "0.42.0"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
regex = "1"
rpassword = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3"
tar = "0.4"
ureq = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.5", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-swift = "0.7.3"

[target.'cfg(target_os = "linux")'.dependencies]
nono = { version = "0.75", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
io-harness = "0.83"

[profile.release]
lto = "thin"
strip = true

# Keep development artifacts bounded. Dependency debug information and
# incremental caches are disproportionately large for this workspace and are
# not needed for normal local runs or tests. The application crate retains
# line-level debug information for useful backtraces.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
