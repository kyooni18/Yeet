<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Yeet Remote</title>
<style>
:root{--terminal-font-size:clamp(11px,3.6vw,14px);--void:#080303;--surface:#120708;--surface-2:#1b080a;--red:#da161b;--red-hot:#ff4a41;--border:#681014;--text:#f1ece7;--muted:#9c7e82}
html,body{margin:0;width:100%;height:100%;min-height:100%;background:var(--void);color:var(--text);overflow:hidden}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
body::before{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(218,22,27,.055) 3px,rgba(218,22,27,.055) 4px);opacity:.48;animation:scanlines .8s linear infinite}
body::after{content:"";position:fixed;inset:0;z-index:49;pointer-events:none;box-shadow:inset 0 0 150px rgba(218,22,27,.18),inset 0 0 25px rgba(255,74,65,.07)}
@keyframes scanlines{from{transform:translateY(0)}to{transform:translateY(4px)}}
#screen{--controls-height:0px;box-sizing:border-box;width:100vw;height:100vh;height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) calc(8px + var(--controls-height)) max(8px,env(safe-area-inset-left));white-space:pre;overflow:auto;overscroll-behavior:none;font:var(--terminal-font-size)/1.25 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-variant-ligatures:none;tab-size:4;cursor:text;user-select:text;-webkit-user-select:text;-webkit-overflow-scrolling:touch;text-shadow:0 0 5px rgba(218,22,27,.10)}
#screen *{user-select:text;-webkit-user-select:text}
.code-block{position:relative;display:block;margin:6px 0;padding:8px 10px;background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:2px;box-shadow:inset 12px 0 32px #da161b0b;white-space:pre;overflow:auto;user-select:text;-webkit-user-select:text}
.code-block pre{display:block;margin:0;padding:0;white-space:pre}
.copy-code{position:absolute;top:5px;right:5px;z-index:1;padding:3px 8px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:2px;font:12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;cursor:pointer;letter-spacing:.08em}
.copy-code:hover{background:#26090c;border-color:var(--red);box-shadow:0 0 12px #da161b55}
.copy-code:active{background:var(--red-hot);color:var(--void)}
#keyboard{position:fixed;left:8px;bottom:8px;width:1px;height:1px;opacity:.01;border:0;padding:0;resize:none;pointer-events:none}
#probe{position:fixed;visibility:hidden;white-space:pre;font:var(--terminal-font-size)/1.25 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-variant-ligatures:none}
#auth{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--void);padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-sizing:border-box;overflow:auto}
#auth[hidden]{display:none}
.auth-card{width:min(420px,100%);border:3px double var(--red);border-radius:2px;background:linear-gradient(180deg,#160607,var(--surface));padding:22px;box-sizing:border-box;box-shadow:0 20px 70px #000c,0 0 32px #da161b24,inset 0 0 30px #da161b0d}
.auth-title{font-size:18px;font-weight:700;margin:0 0 8px;color:var(--red-hot);letter-spacing:.08em}.auth-copy{color:var(--muted);line-height:1.5;margin:0 0 16px}
.auth-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.auth-row>*{min-width:0}
#auth-key{flex:1;background:var(--void);color:var(--text);border:1px solid var(--border);border-radius:2px;padding:10px 11px;font:inherit;outline:none}
#auth-key:focus{border-color:var(--red-hot);box-shadow:0 0 16px #ff4a4140}
.auth-button{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:2px;padding:9px 12px;font:inherit;cursor:pointer;touch-action:manipulation;min-height:42px;letter-spacing:.06em}.auth-button:hover{background:#26090c;border-color:var(--red);box-shadow:0 0 12px #da161b44}
#auth-error{min-height:1.4em;color:var(--red-hot);margin-top:12px;white-space:pre-wrap}
#mobile-controls{display:none}
@media (max-width:700px){
  #screen{--controls-height:52px}
  #mobile-controls{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:#120708ef;border-top:1px solid var(--border);box-sizing:border-box;overscroll-behavior-x:contain;scrollbar-width:none;touch-action:pan-x}
  #mobile-controls::-webkit-scrollbar{display:none}
  .mobile-key{flex:0 0 auto;min-width:42px;height:40px;padding:0 10px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;font:inherit;font-size:12px;font-weight:700;touch-action:manipulation}
  .mobile-key:active,.mobile-key[aria-pressed="true"]{background:var(--red-hot);color:var(--void)}
  .mobile-key[data-key="Enter"]{min-width:58px}
}
@media (min-aspect-ratio:2/1) and (min-width:1000px){
  :root{--terminal-font-size:clamp(11px,1vw,15px)}
  #screen{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
}
@media (max-aspect-ratio:4/5){
  :root{--terminal-font-size:clamp(10px,2.8vw,13px)}
  #screen{padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right))}
}
@media (orientation:landscape) and (max-height:520px){
  :root{--terminal-font-size:clamp(10px,2.7vw,14px)}
  #screen{--controls-height:46px}
  #mobile-controls{padding-top:3px;padding-bottom:3px}
  .mobile-key{height:36px}
}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
</style>
</head>
<body>
<div id="screen" aria-label="Yeet terminal"></div>
<textarea id="keyboard" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true"></textarea>
<span id="probe">MMMMMMMMMM</span>
<nav id="mobile-controls" aria-label="Terminal controls">
  <button class="mobile-key" type="button" data-key="Escape">Esc</button>
  <button class="mobile-key" type="button" data-key="Tab">Tab</button>
  <button class="mobile-key" type="button" data-key="ArrowUp">↑</button>
  <button class="mobile-key" type="button" data-key="ArrowDown">↓</button>
  <button class="mobile-key" type="button" data-key="ArrowLeft">←</button>
  <button class="mobile-key" type="button" data-key="ArrowRight">→</button>
  <button class="mobile-key" type="button" data-key="PageUp">PgUp</button>
  <button class="mobile-key" type="button" data-key="PageDown">PgDn</button>
  <button class="mobile-key" type="button" data-key="Enter">Enter</button>
  <button class="mobile-key" id="ctrl-key" type="button" aria-pressed="false">Ctrl</button>
</nav>
<div id="auth" hidden>
  <div class="auth-card">
    <div class="auth-title" id="auth-title">Yeet Remote</div>
    <p class="auth-copy" id="auth-copy">Authentication required.</p>
    <div class="auth-row" id="key-row" hidden><input id="auth-key" type="password" autocomplete="current-password" placeholder="Access key"><button class="auth-button" id="key-button">Unlock</button></div>
    <div class="auth-row"><button class="auth-button" id="passkey-button" hidden>Use passkey</button><button class="auth-button" id="enroll-button" hidden>Register passkey</button></div>
    <div id="auth-error"></div>
  </div>
</div>
<script>
const screen=document.getElementById('screen');
const keyboard=document.getElementById('keyboard');
const probe=document.getElementById('probe');
const authPanel=document.getElementById('auth');
const authTitle=document.getElementById('auth-title');
const authCopy=document.getElementById('auth-copy');
const authError=document.getElementById('auth-error');
const authKey=document.getElementById('auth-key');
const keyRow=document.getElementById('key-row');
const keyButton=document.getElementById('key-button');
const passkeyButton=document.getElementById('passkey-button');
const enrollButton=document.getElementById('enroll-button');
const mobileControls=document.getElementById('mobile-controls');
const ctrlKey=document.getElementById('ctrl-key');
let sequence=0,lastSize='',remoteStarted=false;
let ctrlLatched=false;

async function send(payload){
  try{await fetch('/api/input',{method:'POST',headers:{'content-type':'application/json','x-yeet-remote':'1'},body:JSON.stringify(payload),cache:'no-store'});}catch(_){ }
}

async function refresh(){
  try{
    const response=await fetch('/api/frame?after='+sequence,{cache:'no-store'});
    if(response.status===401){remoteStarted=false;await boot();return;}
    if(response.status===200){
      const frame=await response.json();
      sequence=frame.sequence;
      screen.innerHTML=frame.html;
      screen.querySelectorAll('.copy-code').forEach(button=>{
        button.addEventListener('click',async event=>{
          event.stopPropagation();
          const code=button.parentElement.querySelector('pre').textContent.replace(/[ \t]+\n/g,'\n').trimEnd();
          try{
            await navigator.clipboard.writeText(code);
            const label=button.textContent;button.textContent='Copied';
            setTimeout(()=>button.textContent=label,1200);
          }catch(_){ }
        });
      });
    }
  }catch(_){ }
  setTimeout(refresh,60);
}

async function postJSON(url,body){
  const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
  let payload={};
  try{payload=await response.json();}catch(_){ }
  if(!response.ok)throw new Error(payload.error||('Request failed: '+response.status));
  return payload;
}

function b64uToBytes(value){
  const text=value.replace(/-/g,'+').replace(/_/g,'/');
  const padded=text+'='.repeat((4-text.length%4)%4);
  const binary=atob(padded);
  return Uint8Array.from(binary,c=>c.charCodeAt(0));
}

function bytesToB64u(value){
  const bytes=new Uint8Array(value);
  let binary='';
  for(const byte of bytes)binary+=String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function creationOptions(payload){
  const options=payload.options;
  const pk=options.publicKey;
  pk.challenge=b64uToBytes(pk.challenge);
  pk.user.id=b64uToBytes(pk.user.id);
  if(pk.excludeCredentials)for(const item of pk.excludeCredentials)item.id=b64uToBytes(item.id);
  return options;
}

function authenticationOptions(payload){
  const options=payload.options;
  const pk=options.publicKey;
  pk.challenge=b64uToBytes(pk.challenge);
  if(pk.allowCredentials)for(const item of pk.allowCredentials)item.id=b64uToBytes(item.id);
  return options;
}

function serializeRegistration(credential){
  const transports=typeof credential.response.getTransports==='function'?credential.response.getTransports():undefined;
  return {id:credential.id,rawId:bytesToB64u(credential.rawId),type:credential.type,response:{attestationObject:bytesToB64u(credential.response.attestationObject),clientDataJSON:bytesToB64u(credential.response.clientDataJSON),transports},extensions:credential.getClientExtensionResults()};
}

function serializeAuthentication(credential){
  return {id:credential.id,rawId:bytesToB64u(credential.rawId),type:credential.type,response:{authenticatorData:bytesToB64u(credential.response.authenticatorData),clientDataJSON:bytesToB64u(credential.response.clientDataJSON),signature:bytesToB64u(credential.response.signature),userHandle:credential.response.userHandle?bytesToB64u(credential.response.userHandle):null},extensions:credential.getClientExtensionResults()};
}

function showAuth(message){
  authError.textContent=message||'';
  authPanel.hidden=false;
}

function startRemote(){
  if(remoteStarted)return;
  remoteStarted=true;
  authPanel.hidden=true;
  keyboard.focus({preventScroll:true});
  resize();
  refresh();
}

async function loginWithKey(){
  authError.textContent='';
  try{await postJSON('/api/auth/key',{key:authKey.value});authKey.value='';startRemote();}catch(error){showAuth(error.message);}
}

async function loginWithPasskey(){
  authError.textContent='';
  try{
    if(!window.PublicKeyCredential)throw new Error('This browser does not support passkeys.');
    const begin=await postJSON('/api/auth/passkey/begin',{});
    const credential=await navigator.credentials.get(authenticationOptions(begin));
    await postJSON('/api/auth/passkey/finish',{transaction:begin.transaction,credential:serializeAuthentication(credential)});
    startRemote();
  }catch(error){showAuth(error.message);}
}

async function registerPasskey(token){
  authError.textContent='';
  try{
    if(!window.PublicKeyCredential)throw new Error('This browser does not support passkeys.');
    const begin=await postJSON('/api/auth/passkey/register/begin',{token});
    const credential=await navigator.credentials.create(creationOptions(begin));
    await postJSON('/api/auth/passkey/register/finish',{transaction:begin.transaction,credential:serializeRegistration(credential)});
    history.replaceState({},'', '/');
    startRemote();
  }catch(error){showAuth(error.message);}
}

async function boot(){
  try{
    const params=new URLSearchParams(location.search);
    const enrollment=location.pathname==='/enroll'?params.get('token'):null;
    const response=await fetch('/api/auth/status'+(enrollment?'?enroll='+encodeURIComponent(enrollment):''),{cache:'no-store'});
    const status=await response.json();
    if(enrollment&&status.enrollmentValid){
      authTitle.textContent='Register passkey';
      authCopy.textContent='This one-time enrollment was authorized from the local Yeet terminal.';
      keyRow.hidden=true;passkeyButton.hidden=true;enrollButton.hidden=false;
      enrollButton.onclick=()=>registerPasskey(enrollment);
      showAuth('');return;
    }
    if(!status.required||status.authenticated){startRemote();return;}
    authTitle.textContent='Unlock Yeet Remote';
    authCopy.textContent=(!status.key&&!status.passkey)?'Passkey enrollment is pending. Open the one-time enrollment URL from the local terminal.':'Authenticate to access this workspace.';
    keyRow.hidden=!status.key;passkeyButton.hidden=!status.passkey;enrollButton.hidden=true;
    showAuth('');
    if(status.key)authKey.focus();
  }catch(error){showAuth('Unable to reach Yeet Remote: '+error.message);}
}

keyButton.addEventListener('click',loginWithKey);
authKey.addEventListener('keydown',event=>{if(event.key==='Enter')loginWithKey();});
passkeyButton.addEventListener('click',loginWithPasskey);

function resize(){
  const rect=probe.getBoundingClientRect();
  const charWidth=Math.max(1,rect.width/10);
  const lineHeight=Math.max(1,rect.height);
  const styles=getComputedStyle(screen);
  const paddingWidth=parseFloat(styles.paddingLeft)+parseFloat(styles.paddingRight);
  const paddingHeight=parseFloat(styles.paddingTop)+parseFloat(styles.paddingBottom);
  const cols=Math.max(40,Math.min(300,Math.floor((screen.clientWidth-paddingWidth)/charWidth)));
  const rows=Math.max(12,Math.min(120,Math.floor((screen.clientHeight-paddingHeight)/lineHeight)));
  const key=cols+'x'+rows;
  if(key!==lastSize){lastSize=key;send({type:'resize',cols,rows});}
}

function sendMobileKey(key){
  const ctrl=ctrlLatched;
  ctrlLatched=false;
  ctrlKey.setAttribute('aria-pressed','false');
  send({type:'key',key,ctrl,alt:false,shift:false});
  keyboard.focus({preventScroll:true});
}

mobileControls.addEventListener('click',event=>{
  const button=event.target.closest('[data-key]');
  if(button)sendMobileKey(button.dataset.key);
});
ctrlKey.addEventListener('click',()=>{
  ctrlLatched=!ctrlLatched;
  ctrlKey.setAttribute('aria-pressed',String(ctrlLatched));
  if(ctrlLatched)keyboard.focus({preventScroll:true});
});

const special=new Set(['Enter','Escape','Backspace','Delete','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown','Tab','Insert']);
keyboard.addEventListener('keydown',event=>{
  if(event.metaKey)return;
  if(event.ctrlKey && (event.key==='v'||event.key==='V'))return;
  if(event.ctrlKey && (event.key==='c'||event.key==='C') && window.getSelection().toString())return;
  if(special.has(event.key)||event.key.startsWith('F')||event.ctrlKey||event.altKey){
    event.preventDefault();
    send({type:'key',key:event.key,ctrl:event.ctrlKey,alt:event.altKey,shift:event.shiftKey});
  }
});
keyboard.addEventListener('input',event=>{
  if(event.isComposing)return;
  const text=keyboard.value;
  keyboard.value='';
  if(!text)return;
  if(ctrlLatched){
    for(const character of text)send({type:'key',key:character,ctrl:true,alt:false,shift:false});
    ctrlLatched=false;
    ctrlKey.setAttribute('aria-pressed','false');
  }else send({type:'text',text});
});
screen.addEventListener('click',()=>{if(!window.getSelection().toString())keyboard.focus({preventScroll:true});});
screen.addEventListener('wheel',event=>{event.preventDefault();send({type:'wheel',delta_y:event.deltaY<0?-1:1});},{passive:false});
window.addEventListener('resize',resize);
window.visualViewport?.addEventListener('resize',resize);
window.addEventListener('focus',()=>{if(authPanel.hidden)keyboard.focus({preventScroll:true});});
new ResizeObserver(resize).observe(document.documentElement);
boot();
</script>
</body>
</html>
