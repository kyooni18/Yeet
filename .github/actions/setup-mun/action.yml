name: Set up Mün
description: Build the pinned Mün workspace required by the compatibility WebUI.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: kyooni18/Mun
        ref: 40fe98d8d33e20d5dc66785e83bb021cc9b52420
        path: .release-deps/mun
    - uses: pnpm/action-setup@v4
      with:
        version: 11.22.0
    - shell: bash
      working-directory: .release-deps/mun
      run: |
        pnpm install --frozen-lockfile
        # This Mün revision compiles against Node built-ins without declaring their types.
        pnpm add --save-dev --workspace-root @types/node@22
        pnpm --filter '@mun-ui/vite...' --filter '@mun-ui/web...' run build
        echo "MUN_PATH=$(pwd -W 2>/dev/null || pwd)" >> "$GITHUB_ENV"
