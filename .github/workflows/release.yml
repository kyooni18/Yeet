name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a release tag
        if: github.ref_type != 'tag'
        run: echo 'Dispatch this workflow on a v<version> tag.' >&2; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: RuntimeSource/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: node Scripts/verify-release-version.mjs "$GITHUB_REF_NAME"
      - run: npm --prefix RuntimeSource ci
      - run: npm --prefix RuntimeSource run check
      - run: cargo build --bin yeet
      - run: cargo test --lib --bins -- --test-threads=1

  prepare-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --prerelease --generate-notes --title "$GITHUB_REF_NAME"
          fi

  package:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-latest
            label: linux-i686
            target: i686-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: windows-latest
            label: windows-x64
          - os: windows-11-arm
            label: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: RuntimeSource/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      - uses: ./.github/actions/setup-mun
      - name: Install Linux i686 toolchain
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}
        run: |
          if ($env:WINDOWS_SIGN_CERTIFICATE_BASE64) {
            $Pfx = Join-Path $env:RUNNER_TEMP "yeet-signing.pfx"
            [IO.File]::WriteAllBytes($Pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERTIFICATE_BASE64))
            "YEET_SIGN_PFX=$Pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: sh
        env:
          YEET_VERSION: ${{ github.ref_name }}
          YEET_BUILD_TARGET: ${{ matrix.target }}
        run: ./Scripts/package-release.sh
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YEET_VERSION: ${{ github.ref_name }}
          YEET_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
        run: .\Scripts\package-release.ps1
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: target/packages/*
      - uses: actions/upload-artifact@v4
        with:
          name: yeet-${{ matrix.label }}
          path: target/packages/*
          if-no-files-found: error
      - name: Publish this platform as soon as it is ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" target/packages/* --clobber
          # The prerelease becomes visible only after one platform is complete.
          gh release edit "$GITHUB_REF_NAME" --draft=false

  finalize:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --pattern 'yeet-*' --pattern 'yeet_*'
      - name: Generate aggregate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum --check ./*.sha256
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS
      - name: Attest aggregate checksums
        uses: actions/attest@v4
        with:
          subject-path: release-assets/SHA256SUMS
      - name: Render Homebrew formula
        shell: bash
        run: ./Scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" release-assets target/homebrew/Formula/yeet.rb
      - name: Publish aggregate checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS --clobber
      - name: Update Homebrew tap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not configured; cannot update the Homebrew tap."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$HOME/.ssh/yeet-homebrew-tap"
          chmod 600 "$HOME/.ssh/yeet-homebrew-tap"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/yeet-homebrew-tap -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          rm -rf target/homebrew/tap
          git clone --depth 1 git@github.com:kyooni18/homebrew-tap.git target/homebrew/tap
          mkdir -p target/homebrew/tap/Formula
          cp target/homebrew/Formula/yeet.rb target/homebrew/tap/Formula/yeet.rb

          cd target/homebrew/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- Formula/yeet.rb)" ]; then
            echo "Homebrew formula is already current."
            exit 0
          fi
          git add Formula/yeet.rb
          git commit -m "yeet $GITHUB_REF_NAME"
          git push origin HEAD:main
      - name: Promote the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
