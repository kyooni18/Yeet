name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: RuntimeSource/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: node Scripts/verify-release-version.mjs "$GITHUB_REF_NAME"
      - run: npm --prefix RuntimeSource ci
      - run: npm --prefix RuntimeSource run check
      - run: cargo build --bin yeet
      - run: cargo test --lib --bins -- --test-threads=1
      - run: npm --prefix web ci
      - run: npm --prefix web run build

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            shell: sh
          - os: macos-15-intel
            label: macos-x64
            shell: sh
          - os: ubuntu-latest
            label: linux-x64
            shell: sh
          - os: ubuntu-24.04-arm
            label: linux-arm64
            shell: sh
          - os: windows-latest
            label: windows-x64
            shell: pwsh
          - os: windows-11-arm
            label: windows-arm64
            shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: RuntimeSource/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}
        run: |
          if ($env:WINDOWS_SIGN_CERTIFICATE_BASE64) {
            $Pfx = Join-Path $env:RUNNER_TEMP "yeet-signing.pfx"
            [IO.File]::WriteAllBytes($Pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERTIFICATE_BASE64))
            "YEET_SIGN_PFX=$Pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: sh
        env:
          YEET_VERSION: ${{ github.ref_name }}
        run: ./Scripts/package-release.sh
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YEET_VERSION: ${{ github.ref_name }}
          YEET_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
        run: .\Scripts\package-release.ps1
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: target/packages/*
      - uses: actions/upload-artifact@v4
        with:
          name: yeet-${{ matrix.label }}
          path: target/packages/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: yeet-*
          path: release-assets
          merge-multiple: true
      - name: Generate aggregate checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attest aggregate checksums
        uses: actions/attest@v4
        with:
          subject-path: release-assets/SHA256SUMS
      - name: Render Homebrew formula
        shell: bash
        run: ./Scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" release-assets target/homebrew/Formula/yeet.rb
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Update Homebrew tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi

          export GH_TOKEN="$HOMEBREW_TAP_TOKEN"
          gh auth setup-git
          rm -rf target/homebrew/tap
          gh repo clone kyooni18/homebrew-tap target/homebrew/tap -- --depth 1
          mkdir -p target/homebrew/tap/Formula
          cp target/homebrew/Formula/yeet.rb target/homebrew/tap/Formula/yeet.rb

          cd target/homebrew/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- Formula/yeet.rb)" ]; then
            echo "Homebrew formula is already current."
            exit 0
          fi
          git add Formula/yeet.rb
          git commit -m "yeet $GITHUB_REF_NAME"
          git push
