name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node Scripts/verify-release-version.mjs

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: RuntimeSource/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm --prefix RuntimeSource ci
      - run: npm --prefix RuntimeSource run build
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo build --bin yeet
      - run: cargo test --all-targets -- --test-threads=1
      - run: cargo clippy --all-targets -- -D warnings

  runtime-source:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: RuntimeSource
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: RuntimeSource/package-lock.json
      - run: npm ci
      - run: npm run check

  cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: RuntimeSource/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm --prefix RuntimeSource ci
      - run: npm --prefix RuntimeSource run build
      - name: Native CLI/runtime smoke
        shell: pwsh
        run: |
          $env:YEET_RUNTIME_DIR = (Resolve-Path "RuntimeSource").Path
          $env:YEET_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "yeet-ci-config"
          if (Test-Path $env:YEET_CONFIG_DIR) { Remove-Item -Recurse -Force $env:YEET_CONFIG_DIR }
          New-Item -ItemType Directory -Force $env:YEET_CONFIG_DIR | Out-Null
          cargo run --quiet -- doctor
          cargo run --quiet -- model set openai/test-model | Out-Null
          $model = (cargo run --quiet -- model get).Trim()
          if ($model -ne "openai/test-model") { throw "model round trip failed: $model" }
      - name: Windows installer scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @("install.ps1", "Scripts/package-release.ps1", "serve.ps1")) {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in $parseErrors) { Write-Error ("{0}: {1}" -f $script, $parseError) }
            if ($parseErrors.Count -gt 0) { exit 1 }
          }
          Write-Host "PowerShell scripts parse cleanly"
      - name: Windows installer bundle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Stage = Join-Path $env:RUNNER_TEMP "yeet-bundle"
          if (Test-Path $Stage) { Remove-Item -Recurse -Force $Stage }
          New-Item -ItemType Directory -Force (Join-Path $Stage "bin") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $Stage "share\yeet\runtime") | Out-Null
          Copy-Item "target\debug\yeet.exe" (Join-Path $Stage "bin\yeet.exe")
          Copy-Item -Recurse "RuntimeSource\dist" (Join-Path $Stage "share\yeet\runtime\dist")
          Copy-Item -Recurse "RuntimeSource\skills" (Join-Path $Stage "share\yeet\runtime\skills")
          Copy-Item "RuntimeSource\package.json" (Join-Path $Stage "share\yeet\runtime\package.json")
          $env:YEET_PREFIX = Join-Path $env:RUNNER_TEMP "yeet-install-prefix"
          $env:YEET_NO_PATH_UPDATE = "1"
          & (Join-Path $Stage "install.ps1")
          $Installed = & (Join-Path $env:YEET_PREFIX "bin\yeet.exe") --version
          if (-not $Installed) { throw "installed yeet.exe did not report a version" }
          Write-Host "Installed $Installed through install.ps1"

  remote-web-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mun
      - run: npm --prefix web ci
      - run: npm --prefix RuntimeSource ci
      - run: npm --prefix RuntimeSource run build
      - run: npm --prefix web run build
      - run: cargo build --release

  arm64-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: RuntimeSource/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm --prefix RuntimeSource ci
      - run: npm --prefix RuntimeSource run check
      - run: cargo check --all-targets
      - run: cargo build --bin yeet
      - run: cargo test --all-targets -- --test-threads=1
      - run: cargo clippy --all-targets -- -D warnings
      - name: Native ARM64 CLI/runtime smoke
        shell: pwsh
        run: |
          $env:YEET_RUNTIME_DIR = (Resolve-Path "RuntimeSource").Path
          $env:YEET_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "yeet-arm64-config"
          if (Test-Path $env:YEET_CONFIG_DIR) { Remove-Item -Recurse -Force $env:YEET_CONFIG_DIR }
          New-Item -ItemType Directory -Force $env:YEET_CONFIG_DIR | Out-Null
          cargo run --quiet -- doctor
          cargo run --quiet -- model set openai/test-model | Out-Null
          $model = (cargo run --quiet -- model get).Trim()
          if ($model -ne "openai/test-model") { throw "ARM64 model round trip failed: $model" }

  remote-web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mun
      - run: npm --prefix web ci
      - run: npm --prefix RuntimeSource ci
      - run: npm --prefix RuntimeSource run build
      - run: npm --prefix web run build
      - run: cargo build --release
      - run: npm --prefix web exec -- playwright install --with-deps chromium webkit
      - run: npm --prefix web run test:e2e


  linux-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke Docker image
        run: sh ./Scripts/test-linux-container.sh
